name: pipeline

# Manual trigger only, on purpose: this is a practice repo and it should not
# spend GitHub Actions minutes on its own. To run it daily, uncomment `schedule`.
on:
  workflow_dispatch:
    inputs:
      top_n:
        description: "Number of coins to fetch"
        default: "100"
  # schedule:
  #   - cron: "17 6 * * *"   # every day at 06:17 UTC

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      - name: Run pipeline
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python -m crypto_etl run --top-n "${{ inputs.top_n }}"

      - name: Upload data layers
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ github.run_id }}
          path: data/
          retention-days: 7
